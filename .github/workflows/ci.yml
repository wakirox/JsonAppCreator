name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Kotlin style (ktlint)
        run: ./gradlew --no-daemon ktlintCheck

      - name: Run unit and screenshot tests
        run: ./gradlew --no-daemon :shared:testAndroidHostTest :app:testDebugUnitTest

      - name: Lint (debug)
        # Any warning fails; :shared is checked with the app. One variant per run: two in one run can crash lint.
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Lint (release)
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Validate example configuration
        run: ./gradlew --no-daemon :app:validateConfig -Pconfig=examples/v3_static_catalog.json

      - name: Build debug APK
        env:
          APP_CONFIG_KEYS_BASE64: ${{ secrets.APP_CONFIG_KEYS_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build the minified release (R8)
        # Unsigned here: it checks that R8 builds the release the stores get.
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Appkin-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/test-results/
            app/build/outputs/tmdb-screenshots/
          if-no-files-found: ignore
          retention-days: 7
