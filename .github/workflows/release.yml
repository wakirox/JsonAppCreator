name: Release

# A vMAJOR.MINOR.PATCH tag is tested and its release built here, unsigned: the signing key stays on the owner's
# machine, where tools/release.sh signs the same commit and publishes the GitHub Release (see docs/RELEASING.md).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Derive release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo '::error::Release tags must use the vMAJOR.MINOR or vMAJOR.MINOR.PATCH format.'
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[4]:-0}))

          if (( minor > 999 || patch > 999 )); then
            echo '::error::Release minor and patch components must be between 0 and 999.'
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo '::error::The derived Android versionCode is outside the supported range.'
            exit 1
          fi

          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit and screenshot tests
        run: ./gradlew --no-daemon :shared:testAndroidHostTest :app:testDebugUnitTest

      - name: Validate example configuration
        run: ./gradlew --no-daemon :app:validateConfig -Pconfig=examples/v3_static_catalog.json

      - name: Build the release (unsigned; Rome signs and publishes it)
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_CONFIG_KEYS_BASE64: ${{ secrets.APP_CONFIG_KEYS_BASE64 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
